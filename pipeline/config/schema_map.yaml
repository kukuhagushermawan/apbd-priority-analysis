# =============================================================================
# schema_map.yaml — pemetaan berkas mentah DJPK (data/raw/{tahun}) ke skema baku
# =============================================================================
# Hasil audit format (lihat docs/audit_format.md). Berkas mentah TIDAK pernah
# ditimpa; semua penyesuaian dilakukan di pipeline berdasarkan peta ini.
#
# Konvensi:
#   - Nomor baris 1-based (seperti di Excel). Kolom memakai huruf Excel.
#   - Semua nilai dalam Rupiah penuh (faktor_satuan = 1) di kelima tahun.
#   - Label dinormalisasi sebelum dicocokkan: trim, spasi ganda -> satu spasi,
#     casefold. Kode diambil dari awalan "NN. " pada label.
# =============================================================================

versi: 1
tanggal_audit: 2026-10-18

skema_baku:
  # Keluaran tahap standardisasi (satu baris per tahun x pemda x fungsi x jenis)
  fungsi_long:
    - tahun            # int16
    - kode_pemda       # str "NN.NN", kode baku (kode 2023+), lihat crosswalk
    - nama_pemda       # str, nama kanonik dari crosswalk
    - tingkat          # {provinsi, kabupaten, kota}
    - provinsi_induk   # str "NN.00" provinsi induk pada tahun tsb
    - kode_fungsi      # str "01".."11"
    - nama_fungsi      # str, nama baku dari kamus
    - kode_jenis       # str "51".."54" (jenis belanja dalam berkas fungsi)
    - nilai_anggaran   # float64, Rupiah penuh, NaN -> 0
  # Keluaran ekstraksi Ringkasan (dipakai untuk validasi total & indikator)
  ringkas_long:
    - tahun
    - kode_pemda
    - nama_pemda
    - kode_akun        # str, skema 4 digit Permendagri 77/2020 (mis. "5101")
    - nama_akun
    - nilai_anggaran

kode_pemda:
  pola: '^\d{2}\.\d{2}$'
  dtype_baca: str          # WAJIB: tanpa dtype=str pandas mengubah "01.10" -> 1.1
  aturan_tingkat:
    provinsi: 'kode berakhiran ".00"'
    kabupaten: 'nama diawali "Kab."'
    kota: 'nama diawali "Kota"'
  crosswalk: pipeline/config/crosswalk_pemda.csv   # dibuat di milestone 2

# -----------------------------------------------------------------------------
# Kamus 11 fungsi baku (klasifikasi fungsi Kepmendagri 050-5889/2021, DJPK)
# aktif=false: tidak pernah muncul di data 2022-2026 (tidak ada kolom/baris).
# -----------------------------------------------------------------------------
fungsi_baku:
  "01": {nama: Pelayanan Umum, aktif: true, alias: [pelayanan umum]}
  "02": {nama: Pertahanan, aktif: false, alias: [pertahanan]}
  "03": {nama: Ketertiban dan Keamanan, aktif: true, alias: [ketertiban dan keamanan]}
  "04": {nama: Ekonomi, aktif: true, alias: [ekonomi]}
  "05": {nama: Perlindungan Lingkungan Hidup, aktif: true, alias: [perlindungan lingkungan hidup, lingkungan hidup]}
  "06": {nama: Perumahan dan Fasilitas Umum, aktif: true, alias: [perumahan dan fasilitas umum]}
  "07": {nama: Kesehatan, aktif: true, alias: [kesehatan]}
  "08": {nama: Pariwisata, aktif: true, alias: [pariwisata, pariwisata dan budaya]}
  "09": {nama: Agama, aktif: false, alias: [agama]}
  "10": {nama: Pendidikan, aktif: true, alias: [pendidikan]}
  "11": {nama: Perlindungan Sosial, aktif: true, alias: [perlindungan sosial]}

jenis_belanja_fungsi:
  "51": {nama: Belanja Pegawai, alias: [belanja pegawai]}
  "52": {nama: Belanja Barang dan Jasa, alias: [belanja barang dan jasa, belanja barang jasa]}
  "53": {nama: Belanja Modal, alias: [belanja modal]}
  "54": {nama: Belanja Lainnya, alias: [belanja lainnya]}

# Kode akun Ringkasan: 2022 memakai 3 digit ("511."), 2023+ memakai 4 digit
# ("5101."). Aturan konversi 3 -> 4 digit: "abc" -> "ab0c" (511 -> 5101,
# 624 -> 6204). Kode 1-2 digit (5, 51) sama di semua tahun.
akun_ringkas:
  total_belanja: "5"
  akun_dipakai:
    "5": Belanja Daerah
    "51": Belanja Operasi
    "5101": Belanja Pegawai
    "52": Belanja Modal
    "53": Belanja Tidak Terduga
    "54": Belanja Transfer
    "4": Pendapatan Daerah

# -----------------------------------------------------------------------------
# Template bersama. Struktur sheet "Fungsi" (wide) identik di 5 tahun:
#   baris 5 = fungsi (sel gabungan 4 kolom, perlu forward-fill),
#   baris 6 = jenis belanja, data mulai baris 7, kolom A kode, B nama,
#   kolom C..AL = 9 fungsi x 4 jenis = 36 kolom nilai.
# Karena itu sheet wide dipakai sebagai SUMBER UTAMA semua tahun (satu parser).
# Sheet "Datarow" (long) 2023-2026 dipakai sebagai cek silang (selisih <= Rp1).
# -----------------------------------------------------------------------------
_fungsi_wide: &fungsi_wide
  orientasi: wide
  baris_judul: 1
  baris_tanggal: 2
  baris_jumlah_daerah: 3     # "Jumlah: N daerah"
  baris_header_fungsi: 5
  baris_header_jenis: 6
  baris_data_mulai: 7
  kolom_kode: A
  kolom_nama: B
  kolom_nilai_mulai: C
  faktor_satuan: 1
  header_kode: Kodepemda
  header_nama: Namapemda

tahun:
  2022:
    fungsi:
      <<: *fungsi_wide
      berkas: 2022/Anggaran-Belanja-Fungsi_2022.xlsx
      sheet: Sheet3
      header_kode: Kode Pemda        # beda: pakai spasi
      header_nama: Nama Pemda
      cek_silang_long: null          # beda: TIDAK ada sheet Datarow
      catatan:
        - Satu-satunya tahun tanpa sheet Datarow, Mandatory Spending, dan tagging.
        - Label fungsi tanpa nol di depan ("1. Pelayanan Umum" bukan "01.").
        - 'Fungsi 05 bernama "Lingkungan Hidup" (2023+ "Perlindungan Lingkungan Hidup").'
        - 'Jenis 52 bernama "Belanja Barang Jasa" (2023+ "Belanja Barang dan Jasa").'
        - 542 pemda (34 provinsi); kode wilayah Papua masih pra-pemekaran.
    ringkas:
      berkas: 2022/Anggaran_APBD_Ringkas_2022.xlsx
      sheet: APBD 2022_FINAL
      orientasi: akun_x_pemda        # akun di baris, pemda di kolom
      baris_kode_pemda: 4
      baris_nama_pemda: 5
      baris_data_mulai: 7            # baris 6 kosong (A4:A6 digabung)
      kolom_akun: A
      skema_kode_akun: 3digit        # beda: "511. Belanja Pegawai"
      kolom_dibuang: []
      faktor_satuan: 1
      cek_silang_long: null          # beda: TIDAK ada sheet long
    tagging: null

  2023:
    fungsi:
      <<: *fungsi_wide
      berkas: 2023/Anggaran_Belanja_Fungsi_2023.xlsx
      sheet: Fungsi_Kepmen050
      cek_silang_long:
        sheet: Datarow Fungsi_Kepmen050
        kolom: {AkunAnalisismap: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiKepmen: fungsi, Nilaianggaran: nilai_anggaran}
    ringkas:
      berkas: 2023/Anggaran_APBD_Ringkas_2023.xlsx
      sheet: Sheet2
      orientasi: akun_x_pemda
      baris_kode_pemda: 4
      baris_nama_pemda: 5
      baris_data_mulai: 7
      kolom_akun: A
      skema_kode_akun: 4digit
      kolom_dibuang: []
      faktor_satuan: 1
      catatan: [Label akun berindentasi spasi dan berisi spasi ganda; wajib di-trim.]
      cek_silang_long:
        sheet: Sheet1
        kolom: {Kodepemda: kode_pemda, Namapemda: nama_pemda, Standarjenis: akun_jenis, Standarkelompok: akun_kelompok, Standarutama: akun_utama, Nilaianggaran: nilai_anggaran}
    tagging:
      sheet: Datarow Mandatory Spending
      kolom: {AkunAnalisismap: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiAdj: tag, Nilaianggaran: nilai_anggaran}
      tag_tersedia: [07. Kesehatan Tagging, 10. Pendidikan Tagging, 07. Kesehatan dan 10. Pendidikan Tagging]

  2024:
    fungsi:
      <<: *fungsi_wide
      berkas: 2024/Anggaran_Belanja_Fungsi_2024.xlsx
      sheet: Fungsi Kepmen
      cek_silang_long:
        sheet: Datarow Fungsi Kepmen
        kolom: {Akunanalisis: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiKepmen: fungsi, Nilaianggaran: nilai_anggaran}
    ringkas:
      berkas: 2024/Anggaran_APBD_Ringkas_2024.xlsx
      sheet: Sheet2
      orientasi: akun_x_pemda
      baris_kode_pemda: 4
      baris_nama_pemda: 5
      baris_data_mulai: 6            # beda dari 2022/2023: tanpa baris kosong
      kolom_akun: A
      skema_kode_akun: 4digit
      kolom_dibuang: []
      faktor_satuan: 1
      catatan: [Label akun kelompok huruf kapital ("5. BELANJA DAERAH").]
      cek_silang_long:
        sheet: Sheet1
        kolom: {Kodepemda: kode_pemda, Namapemda: nama_pemda, Standarjenis: akun_jenis, Standarkelompok: akun_kelompok, Standarutama: akun_utama, Tahun: tahun, Nilaianggaran: nilai_anggaran}
    tagging:
      sheet: Datarow Mandatory Spending
      kolom: {Akunanalisis: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiAdj: tag, Nilaianggaran: nilai_anggaran}
      tag_tersedia: [07. Kesehatan Tagging, 10. Pendidikan Tagging]

  2025:
    fungsi:
      <<: *fungsi_wide
      berkas: 2025/Anggaran_Belanja_Fungsi_2025.xlsx
      sheet: Fungsi Kepmen
      cek_silang_long:
        sheet: " Datarow Fungsi Kepmen"   # beda: nama sheet berawalan spasi
        kolom: {AkunAnalisismap: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, "Standarfungsikepmen (group)": fungsi, Nilaianggaran: nilai_anggaran}
        catatan: [Baris 2 tidak berurutan dan duplikat kunci (11.00, 04 Ekonomi, 52) -> wajib dijumlah.]
    ringkas:
      berkas: 2025/Anggaran_APBD_Ringkas_2025.xlsx
      sheet: Tabel
      orientasi: akun_x_pemda
      baris_kode_pemda: 4
      baris_nama_pemda: 5
      baris_data_mulai: 6
      kolom_akun: A
      skema_kode_akun: 4digit
      kolom_dibuang: [Grand Total]   # beda: ada kolom total nasional di ujung
      faktor_satuan: 1
      cek_silang_long:
        sheet: RAW                    # beda: rinci sampai level objek (6 digit)
        kolom: {tahun: tahun, kodepemda: kode_pemda, namapemda: nama_pemda, standarutama: akun_utama, standarkelompok: akun_kelompok, standarjenis: akun_jenis, standarobjek: akun_objek, sum: nilai_anggaran}
    tagging:
      sheet: Datarow Mandatory Spending
      kolom: {AkunAnalisismap: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiAdj: tag, Nilaianggaran: nilai_anggaran}
      tag_tersedia: [07. Kesehatan Tagging, 10. Pendidikan Tagging]
      catatan: [15.473 baris kosong di bawah data -> dropna.]

  2026:
    fungsi:
      <<: *fungsi_wide
      berkas: 2026/Anggaran_Belanja_Fungsi_2026.xlsx
      sheet: Fungsi Kepmen
      cek_silang_long:
        sheet: Datarow Fungsi Kepmen
        kolom: {AkunAnalisis: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, Standarfungsikepmenfinal: fungsi, Nilaianggaran: nilai_anggaran}
        catatan: [Label fungsi 03 muncul dua versi kapitalisasi ("Dan"/"dan") -> normalisasi casefold.]
    ringkas:
      berkas: 2026/Anggaran_APBD_Ringkas_2026.xlsx
      sheet: Tabel
      orientasi: akun_x_pemda
      baris_kode_pemda: 4
      baris_nama_pemda: 5
      baris_data_mulai: 6
      kolom_akun: A
      skema_kode_akun: 4digit
      kolom_dibuang: []
      faktor_satuan: 1
      catatan: [Banyak nilai berdesimal (sen), tetap Rupiah penuh.]
      cek_silang_long:
        sheet: Raw
        kolom: {Kodepemda: kode_pemda, Namapemda: nama_pemda, standarjenis: akun_jenis, standarkelompok: akun_kelompok, standarutama: akun_utama, Tahun: tahun, Nilaianggaran: nilai_anggaran}
    tagging:
      sheet: Datarow Mandatory Spending
      kolom: {AkunAnalisis: jenis, Kodepemda: kode_pemda, Namapemda: nama_pemda, StandarfungsiAdjfinal: tag, Nilaianggaran: nilai_anggaran}
      tag_tersedia: [10. Pendidikan Tagging]
      catatan: [Tagging kesehatan dihentikan (bukan lagi belanja wajib).]

# -----------------------------------------------------------------------------
# Pemekaran Papua (berlaku mulai APBD 2023). Kabupaten/kota yang pindah
# provinsi tetap entitas yang sama; kode baku = kode 2023+. Detail per pemda
# akan dimuat di crosswalk_pemda.csv (milestone 2).
# -----------------------------------------------------------------------------
pemekaran_papua:
  tahun_berlaku: 2023
  provinsi_baru:
    "35.00": Provinsi Papua Selatan
    "36.00": Provinsi Papua Tengah
    "37.00": Provinsi Papua Pegunungan
    "38.00": Provinsi Papua Barat Daya
  provinsi_induk_berubah_wilayah: ["26.00", "32.00"]   # Papua, Papua Barat
  kode_lama_ke_baru:
    "26.03": "37.01"   # Kab. Jayawijaya
    "26.04": "35.01"   # Kab. Merauke
    "26.05": "36.01"   # Kab. Mimika
    "26.06": "36.02"   # Kab. Nabire
    "26.07": "36.03"   # Kab. Paniai
    "26.08": "36.04"   # Kab. Puncak Jaya
    "26.13": "37.02"   # Kab. Yahukimo
    "26.14": "37.03"   # Kab. Pegunungan Bintang
    "26.15": "37.04"   # Kab. Tolikara
    "26.16": "35.02"   # Kab. Boven Digoel
    "26.17": "35.03"   # Kab. Mappi
    "26.18": "35.04"   # Kab. Asmat
    "26.22": "37.05"   # Kab. Mamberamo Tengah
    "26.23": "37.06"   # Kab. Yalimo
    "26.24": "37.07"   # Kab. Lanny Jaya
    "26.25": "37.08"   # Kab. Nduga
    "26.26": "36.05"   # Kab. Dogiyai
    "26.27": "36.06"   # Kab. Puncak
    "26.28": "36.07"   # Kab. Intan Jaya
    "26.29": "36.08"   # Kab. Deiyai
    "32.03": "38.01"   # Kab. Sorong
    "32.04": "38.02"   # Kota Sorong
    "32.05": "38.03"   # Kab. Raja Ampat
    "32.06": "38.04"   # Kab. Sorong Selatan
    "32.10": "38.05"   # Kab. Maybrat
    "32.11": "38.06"   # Kab. Tambrauw
  panel_tidak_seimbang: ["26.00", "32.00", "35.00", "36.00", "37.00", "38.00"]

# Varian nama pada kode yang sama -> nama kanonik (dipakai untuk crosswalk)
nama_kanonik:
  "02.13": Kab. Toba                 # 2022: Kab. Toba Samosir
  "03.01": Kab. Lima Puluh Kota      # 2022 & 2025+: Kab. Limapuluh Kota
  "05.01": Kab. Batang Hari          # 2022: Kab. Batanghari
  "18.03": Kab. Kepulauan Sangihe    # 2022: Kab. Sangihe
  "21.06": Kota Baubau               # 2023+: Kota Bau-bau

# Disetujui pada tinjauan milestone 1: selisih 2022->2023 diberi penanda dan
# analitik/model dijalankan dalam dua varian periode.
patahan_klasifikasi:
  antara: [2022, 2023]
  varian_periode:
    penuh: [2022, 2026]
    pasca_patahan: [2023, 2026]

validasi:
  toleransi_selisih_pct_awal: 0.5    # batas PERINGATAN
  # Kalibrasi: selisih nyata fungsi vs Ringkasan = 0,0000% di semua pemda dan
  # tahun (maks absolut Rp1.252, di 2025, akibat pembulatan sen). Disetujui:
  # LULUS bila selisih <= 0,01% ATAU <= Rp10.000; PERINGATAN bila <= 0,5%;
  # selain itu GAGAL.
  toleransi_selisih_pct_usulan: 0.01
  toleransi_selisih_abs_rp: 10000
  ambang_nilai_janggal_rp: 1000      # nilai > 0 tapi < Rp1.000 dicatat sebagai anomali
  # Padanan jenis belanja di berkas Fungsi dengan akun Ringkasan (terbukti
  # cocok 0,0000% kecuali 7 pemda 2025 pada pembagian 51/52).
  padanan_jenis_ringkas:
    "51": ["5101"]
    "52": ["5102"]
    "53": ["52"]
    "54": {sisa_dari: "5", dikurangi: ["5101", "5102", "52"]}

# Konfigurasi pipeline. Penjelasan setiap isian ada di docs/metodologi.md.

# Lokasi data per tahun. Sheet Fungsi punya tata letak sama di semua tahun:
# baris 3 "Jumlah: N daerah", baris 5 nama fungsi, baris 6 jenis belanja,
# data mulai baris 7 (kolom A kode pemda, B nama pemda).
# Sheet Ringkas: baris 4 kode pemda, baris berlabel "5. Belanja Daerah" = total.
tahun:
  2022:
    fungsi: {berkas: 2022/Anggaran-Belanja-Fungsi_2022.xlsx, sheet: Sheet3}
    ringkas: {berkas: 2022/Anggaran_APBD_Ringkas_2022.xlsx, sheet: APBD 2022_FINAL}
  2023:
    fungsi: {berkas: 2023/Anggaran_Belanja_Fungsi_2023.xlsx, sheet: Fungsi_Kepmen050}
    ringkas: {berkas: 2023/Anggaran_APBD_Ringkas_2023.xlsx, sheet: Sheet2}
  2024:
    fungsi: {berkas: 2024/Anggaran_Belanja_Fungsi_2024.xlsx, sheet: Fungsi Kepmen}
    ringkas: {berkas: 2024/Anggaran_APBD_Ringkas_2024.xlsx, sheet: Sheet2}
  2025:
    fungsi: {berkas: 2025/Anggaran_Belanja_Fungsi_2025.xlsx, sheet: Fungsi Kepmen}
    ringkas: {berkas: 2025/Anggaran_APBD_Ringkas_2025.xlsx, sheet: Tabel}
  2026:
    fungsi: {berkas: 2026/Anggaran_Belanja_Fungsi_2026.xlsx, sheet: Fungsi Kepmen}
    ringkas: {berkas: 2026/Anggaran_APBD_Ringkas_2026.xlsx, sheet: Tabel}

# Kamus 11 fungsi baku. Pertahanan (02) dan Agama (09) tidak pernah muncul
# di data 2022-2026 -> analisis memakai 9 fungsi aktif.
# alias = variasi nama yang dipakai DJPK (2022 memakai "Lingkungan Hidup").
fungsi:
  "01": {nama: Pelayanan Umum, alias: [pelayanan umum]}
  "02": {nama: Pertahanan, alias: [pertahanan]}
  "03": {nama: Ketertiban dan Keamanan, alias: [ketertiban dan keamanan]}
  "04": {nama: Ekonomi, alias: [ekonomi]}
  "05": {nama: Perlindungan Lingkungan Hidup, alias: [perlindungan lingkungan hidup, lingkungan hidup]}
  "06": {nama: Perumahan dan Fasilitas Umum, alias: [perumahan dan fasilitas umum]}
  "07": {nama: Kesehatan, alias: [kesehatan]}
  "08": {nama: Pariwisata, alias: [pariwisata]}
  "09": {nama: Agama, alias: [agama]}
  "10": {nama: Pendidikan, alias: [pendidikan]}
  "11": {nama: Perlindungan Sosial, alias: [perlindungan sosial]}

